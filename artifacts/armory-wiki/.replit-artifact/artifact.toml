kind = "web"
previewPath = "/"
title = "Арсенал — энциклопедия оружия"
description = "Русскоязычная образовательная энциклопедия об огнестрельном оружии: история, классификация, ключевые модели и проверяемые технические сведения без инструкций по изготовлению или применению."
version = "1.0.0"
id = "artifacts/armory-wiki"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18204

[services.development]
run = "pnpm --filter @workspace/armory-wiki run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/armory-wiki", "run", "build" ]
serve = "static"
publicDir = "artifacts/armory-wiki/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18204"
BASE_PATH = "/"
